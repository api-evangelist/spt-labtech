name: SPT Labtech
description: >-
  SPT Labtech is a life-sciences laboratory-automation company headquartered near
  Cambridge, UK, that designs and manufactures instruments and consumables to accelerate
  drug discovery and life-science research. Its portfolio spans liquid handling (firefly,
  mosquito, dragonfly, apricot), sample preparation (chameleon for cryo-EM and Quantifoil
  supports), and sample management and storage (comPOUND, comPACT, arktic, lab2lab, and
  BioMicroLab). With 400+ employees across seven global locations and 30+ products, SPT
  Labtech serves pharmaceutical, biotech, and academic laboratories. It is a portfolio
  company of Battery Ventures. This profile was added to the API Evangelist network as a
  company lead; SPT Labtech is a hardware and instrumentation vendor and publishes no
  public developer API, SDK, or developer portal at this time.
